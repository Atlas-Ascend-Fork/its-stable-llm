# Pre-commit hooks for its-stable-llm
# Reference style: https://gitcode.com/cann/ops-nn/blob/master/.pre-commit-config.yaml
# Adapted for this Python training repo (Apache-2.0 LICENSE kept).

minimum_pre_commit_version: 4.0.0
exclude: ^LICENSE$|\.(csv|json|parquet|log|png|jpg|jpeg|gif|svg)$

default_stages: [pre-commit]
ci:
  autofix_prs: false
  autoupdate_schedule: monthly

repos:
  - repo: https://gitcode.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: \.(md|ipynb)$
      - id: end-of-file-fixer
        exclude: \.ipynb$
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-added-large-files
        args: ["--maxkb=5120"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-json
        exclude: ^code/fusion_result\.json$

  # OAT / copyright-license header check
  - repo: local
    hooks:
      - id: oat-check
        name: OAT Compliance Check
        entry: bash scripts/oat_check.sh
        language: system
        pass_filenames: false
        types: [file]
        stages: [pre-commit]
        verbose: true
